services:
  postgres:
    image: postgres:16-alpine
    container_name: exo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exo
      POSTGRES_PASSWORD: exo_dev_password
      POSTGRES_DB: exo_express
    ports:
      - "5432:5432"
    volumes:
      - exo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exo -d exo_express"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - exo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  exo-postgres-data:
  exo-redis-data:
